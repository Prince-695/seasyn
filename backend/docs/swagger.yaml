basePath: /
definitions:
  domain.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  domain.ResetPasswordRequest:
    properties:
      email:
        type: string
      otp:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - otp
    - password
    type: object
  domain.Response:
    properties:
      access_token:
        type: string
      data: {}
      error:
        type: string
      message:
        type: string
      response_time:
        type: string
      success:
        type: boolean
    type: object
  domain.SignupRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the SEASYN backend server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: SEASYN API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - '*/*'
      description: get the status of server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Show the status of server.
      tags:
      - root
  /v1/auth/{provider}/callback:
    get:
      description: Handle OAuth provider callback, verify CSRF state, and return tokens
        as cookies.
      parameters:
      - description: OAuth Provider
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth Authorization Code
        in: query
        name: code
        required: true
        type: string
      - description: CSRF State
        in: query
        name: state
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Invalid state or missing code
          schema:
            $ref: '#/definitions/domain.Response'
        "500":
          description: OAuth exchange failed
          schema:
            $ref: '#/definitions/domain.Response'
      summary: OAuth Callback
      tags:
      - auth
  /v1/auth/{provider}/login:
    get:
      description: |-
        Returns the authorization URL for a specific provider (google, github).
        The frontend should redirect the user to the returned auth_url.
      parameters:
      - description: OAuth Provider
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Unsupported provider
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Get OAuth Login URL
      tags:
      - auth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send OTP to user email for password reset
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Request Password Reset
      tags:
      - auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and set access and refresh tokens as HttpOnly
        cookies
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/domain.Response'
      summary: User Login
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: Clear access_token and refresh_token HttpOnly cookies
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Logout User
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchange the refresh_token cookie (or request body) for a new access token.
        The server sets new access_token and refresh_token cookies automatically.
      parameters:
      - description: Refresh Request (optional if refresh_token cookie is set)
        in: body
        name: request
        schema:
          $ref: '#/definitions/domain.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Refresh Access Token
      tags:
      - auth
  /v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Verify OTP and update the user's password
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Invalid or expired OTP
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Reset Password with OTP
      tags:
      - auth
  /v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Register a new user and receive access and refresh tokens via HttpOnly
        cookies
      parameters:
      - description: Signup Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Email already taken or invalid input
          schema:
            $ref: '#/definitions/domain.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.Response'
      summary: User Signup
      tags:
      - auth
  /v1/user/profile:
    get:
      consumes:
      - application/json
      description: Get profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Get User Profile
      tags:
      - user
schemes:
- https
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and then your token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
