basePath: /
definitions:
  domain.AuthStatusResponse:
    properties:
      is_verified:
        type: boolean
    type: object
  domain.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  domain.ColumnDiff:
    properties:
      alter_details:
        items:
          type: string
        type: array
      diff_type:
        description: '"added", "removed", "altered"'
        type: string
      name:
        type: string
      source_column:
        $ref: '#/definitions/domain.ColumnSchema'
      target_column:
        $ref: '#/definitions/domain.ColumnSchema'
    type: object
  domain.ColumnSchema:
    properties:
      comment:
        type: string
      data_type:
        description: Native database data type (e.g., "varchar(255)", "int4")
        type: string
      default_value:
        type: string
      foreign_column:
        type: string
      foreign_table:
        type: string
      is_foreign_key:
        type: boolean
      is_nullable:
        type: boolean
      is_primary_key:
        type: boolean
      max_length:
        type: integer
      name:
        type: string
      season_type:
        allOf:
        - $ref: '#/definitions/domain.SeasonType'
        description: Universal normalized type
    type: object
  domain.CompareSchemaRequest:
    properties:
      source_connection_id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      target_connection_id:
        example: 22222222-2222-2222-2222-222222222222
        type: string
    required:
    - source_connection_id
    - target_connection_id
    type: object
  domain.ConnectionTestResult:
    properties:
      error_message:
        type: string
      latency_ms:
        type: integer
      server_info:
        type: string
      success:
        type: boolean
    type: object
  domain.ConstraintSchema:
    properties:
      columns:
        items:
          type: string
        type: array
      definition:
        type: string
      foreign_columns:
        items:
          type: string
        type: array
      foreign_table:
        type: string
      name:
        type: string
      type:
        description: '"PRIMARY KEY", "FOREIGN KEY", "UNIQUE", "CHECK"'
        type: string
    type: object
  domain.CreateConnectionRequest:
    properties:
      database:
        example: seasyn_db
        maxLength: 100
        minLength: 1
        type: string
      db_type:
        allOf:
        - $ref: '#/definitions/domain.DBType'
        enum:
        - postgres
        - mysql
        - mongodb
        - sqlite
        example: postgres
      file_path:
        example: /data/app.db
        type: string
      host:
        example: db.prod.internal
        type: string
      is_source:
        example: true
        type: boolean
      name:
        example: Production Aurora PG
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: secret_db_pass
        type: string
      port:
        example: 5432
        maximum: 65535
        minimum: 1
        type: integer
      ssl_mode:
        enum:
        - disable
        - require
        - verify-ca
        - verify-full
        - prefer
        example: require
        type: string
      uri:
        example: mongodb+srv://admin:pass@cluster.mongodb.net/app
        type: string
      username:
        example: db_admin
        maxLength: 100
        minLength: 1
        type: string
    required:
    - db_type
    - name
    type: object
  domain.CreateOrgRequest:
    properties:
      description:
        example: Building the future
        maxLength: 500
        type: string
      name:
        example: Acme Corp
        maxLength: 100
        minLength: 2
        type: string
      slug:
        example: acme-corp
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  domain.CreateProjectRequest:
    properties:
      description:
        example: Primary PostgreSQL backend for main service
        maxLength: 500
        type: string
      environment:
        enum:
        - development
        - staging
        - production
        example: production
        type: string
      name:
        example: Main Service DB
        maxLength: 100
        minLength: 2
        type: string
      slug:
        example: main-service-db
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  domain.DBType:
    enum:
    - postgres
    - mysql
    - mongodb
    - sqlite
    type: string
    x-enum-varnames:
    - DBTypePostgres
    - DBTypeMySQL
    - DBTypeMongoDB
    - DBTypeSQLite
  domain.DatabaseSchema:
    properties:
      database_name:
        type: string
      db_type:
        $ref: '#/definitions/domain.DBType'
      inspected_at:
        type: string
      tables:
        items:
          $ref: '#/definitions/domain.TableSchema'
        type: array
    type: object
  domain.DeleteRowRequest:
    properties:
      primary_key:
        additionalProperties: true
        type: object
    required:
    - primary_key
    type: object
  domain.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  domain.IndexSchema:
    properties:
      columns:
        items:
          type: string
        type: array
      is_primary:
        type: boolean
      is_unique:
        type: boolean
      name:
        type: string
      type:
        description: e.g. "btree", "hash", "gin"
        type: string
    type: object
  domain.InsertRowRequest:
    properties:
      data:
        additionalProperties: true
        type: object
    required:
    - data
    type: object
  domain.InviteMemberRequest:
    properties:
      email:
        example: dev@example.com
        type: string
      role:
        allOf:
        - $ref: '#/definitions/domain.OrgRole'
        enum:
        - admin
        - member
        - viewer
        example: member
    required:
    - email
    - role
    type: object
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.OrgMemberDetail:
    properties:
      email:
        type: string
      first_name:
        type: string
      joined_at:
        type: string
      last_name:
        type: string
      role:
        $ref: '#/definitions/domain.OrgRole'
      user_id:
        type: string
      username:
        type: string
    type: object
  domain.OrgRole:
    enum:
    - owner
    - admin
    - member
    - viewer
    type: string
    x-enum-varnames:
    - OrgRoleOwner
    - OrgRoleAdmin
    - OrgRoleMember
    - OrgRoleViewer
  domain.OrgWithRole:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      role:
        $ref: '#/definitions/domain.OrgRole'
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Organization:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Project:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      environment:
        description: e.g. "development", "staging", "production"
        type: string
      id:
        type: string
      name:
        type: string
      organization_id:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.ProjectDetail:
    properties:
      connections:
        items:
          $ref: '#/definitions/domain.PublicDatabaseConnection'
        type: array
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      environment:
        description: e.g. "development", "staging", "production"
        type: string
      id:
        type: string
      name:
        type: string
      organization_id:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.PublicDatabaseConnection:
    properties:
      created_at:
        type: string
      database:
        type: string
      db_type:
        $ref: '#/definitions/domain.DBType'
      file_path:
        type: string
      host:
        type: string
      id:
        type: string
      is_source:
        type: boolean
      name:
        type: string
      port:
        type: integer
      project_id:
        type: string
      ssl_mode:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  domain.PublicUser:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      is_verified:
        type: boolean
      last_name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  domain.QueryResult:
    properties:
      columns:
        items:
          type: string
        type: array
      limit:
        type: integer
      page:
        type: integer
      rows:
        items:
          additionalProperties: true
          type: object
        type: array
      table_name:
        type: string
      total_pages:
        type: integer
      total_rows:
        type: integer
    type: object
  domain.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  domain.ResetPasswordRequest:
    properties:
      email:
        example: user@example.com
        type: string
      new_password:
        example: newsecret123
        minLength: 6
        type: string
      otp:
        example: "123456"
        maxLength: 6
        minLength: 6
        type: string
    required:
    - email
    - new_password
    - otp
    type: object
  domain.Response:
    properties:
      access_token:
        type: string
      data: {}
      error:
        type: string
      message:
        type: string
      response_time:
        type: string
      success:
        type: boolean
    type: object
  domain.SchemaDiff:
    properties:
      generated_at:
        type: string
      source_connection_id:
        type: string
      source_db_type:
        $ref: '#/definitions/domain.DBType'
      tables_added:
        description: Tables present in Source but missing in Target
        items:
          type: string
        type: array
      tables_altered:
        description: Tables present in both but with structural differences
        items:
          $ref: '#/definitions/domain.TableDiff'
        type: array
      tables_removed:
        description: Tables present in Target but missing in Source
        items:
          type: string
        type: array
      tables_same:
        description: Identical tables
        items:
          type: string
        type: array
      target_connection_id:
        type: string
      target_db_type:
        $ref: '#/definitions/domain.DBType'
    type: object
  domain.SeasonType:
    enum:
    - int
    - string
    - bool
    - timestamp
    - json
    - float
    - decimal
    - binary
    - uuid
    - enum
    - array
    - unknown
    type: string
    x-enum-varnames:
    - SeasonTypeInt
    - SeasonTypeString
    - SeasonTypeBool
    - SeasonTypeTimestamp
    - SeasonTypeJSON
    - SeasonTypeFloat
    - SeasonTypeDecimal
    - SeasonTypeBinary
    - SeasonTypeUUID
    - SeasonTypeEnum
    - SeasonTypeArray
    - SeasonTypeUnknown
  domain.SetUsernameRequest:
    properties:
      username:
        example: johndoe_99
        maxLength: 20
        minLength: 3
        type: string
    required:
    - username
    type: object
  domain.SignupRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  domain.TableDiff:
    properties:
      added_indexes:
        items:
          type: string
        type: array
      column_diffs:
        items:
          $ref: '#/definitions/domain.ColumnDiff'
        type: array
      diff_type:
        description: '"added", "removed", "altered", "identical"'
        type: string
      name:
        type: string
      removed_indexes:
        items:
          type: string
        type: array
      source_table:
        $ref: '#/definitions/domain.TableSchema'
      target_table:
        $ref: '#/definitions/domain.TableSchema'
    type: object
  domain.TableSchema:
    properties:
      columns:
        items:
          $ref: '#/definitions/domain.ColumnSchema'
        type: array
      comment:
        type: string
      constraints:
        items:
          $ref: '#/definitions/domain.ConstraintSchema'
        type: array
      indexes:
        items:
          $ref: '#/definitions/domain.IndexSchema'
        type: array
      name:
        type: string
      primary_keys:
        items:
          type: string
        type: array
      row_count:
        type: integer
      size_bytes:
        type: integer
    type: object
  domain.TestConnectionRequest:
    properties:
      database:
        example: seasyn_db
        type: string
      db_type:
        allOf:
        - $ref: '#/definitions/domain.DBType'
        enum:
        - postgres
        - mysql
        - mongodb
        - sqlite
        example: postgres
      file_path:
        example: /data/app.db
        type: string
      host:
        example: db.prod.internal
        type: string
      password:
        example: secret_db_pass
        type: string
      port:
        example: 5432
        maximum: 65535
        minimum: 1
        type: integer
      ssl_mode:
        enum:
        - disable
        - require
        - verify-ca
        - verify-full
        - prefer
        example: require
        type: string
      uri:
        example: mongodb+srv://admin:pass@cluster.mongodb.net/app
        type: string
      username:
        example: db_admin
        type: string
    required:
    - db_type
    type: object
  domain.UpdateConnectionRequest:
    properties:
      database:
        example: seasyn_db
        maxLength: 100
        minLength: 1
        type: string
      file_path:
        example: /data/app.db
        type: string
      host:
        example: db.prod.internal
        type: string
      is_source:
        example: true
        type: boolean
      name:
        example: Production Aurora PG Updated
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: new_secret_pass
        type: string
      port:
        example: 5432
        maximum: 65535
        minimum: 1
        type: integer
      ssl_mode:
        enum:
        - disable
        - require
        - verify-ca
        - verify-full
        - prefer
        example: require
        type: string
      uri:
        example: mongodb+srv://admin:pass@cluster.mongodb.net/app
        type: string
      username:
        example: db_admin
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  domain.UpdateMemberRoleRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/domain.OrgRole'
        enum:
        - admin
        - member
        - viewer
        example: admin
    required:
    - role
    type: object
  domain.UpdateOrgRequest:
    properties:
      description:
        example: Building the future
        maxLength: 500
        type: string
      name:
        example: Acme Corp
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  domain.UpdateProfileRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    required:
    - first_name
    - last_name
    type: object
  domain.UpdateProjectRequest:
    properties:
      description:
        example: Updated description
        maxLength: 500
        type: string
      environment:
        enum:
        - development
        - staging
        - production
        example: production
        type: string
      name:
        example: Main Service DB Updated
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  domain.UpdateRowRequest:
    properties:
      data:
        additionalProperties: true
        type: object
      primary_key:
        additionalProperties: true
        type: object
    required:
    - data
    - primary_key
    type: object
  domain.VerifyEmailRequest:
    properties:
      otp:
        example: "123456"
        maxLength: 6
        minLength: 6
        type: string
    required:
    - otp
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the SEASYN backend server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: SEASYN API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - '*/*'
      description: get the status of server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Show the status of server.
      tags:
      - root
  /v1/auth/{provider}/callback:
    get:
      description: Handle OAuth provider callback, verify CSRF state, and return tokens
        as cookies.
      parameters:
      - description: OAuth Provider
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth Authorization Code
        in: query
        name: code
        required: true
        type: string
      - description: CSRF State
        in: query
        name: state
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Invalid state or missing code
          schema:
            $ref: '#/definitions/domain.Response'
        "500":
          description: OAuth exchange failed
          schema:
            $ref: '#/definitions/domain.Response'
      summary: OAuth Callback
      tags:
      - auth
  /v1/auth/{provider}/login:
    get:
      description: |-
        Returns the authorization URL for a specific provider (google, github).
        The frontend should redirect the user to the returned auth_url.
      parameters:
      - description: OAuth Provider
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Unsupported provider
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Get OAuth Login URL
      tags:
      - auth
  /v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Update password for an authenticated user
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - auth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send OTP to user email for password reset
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Request Password Reset
      tags:
      - auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and set access and refresh tokens as HttpOnly
        cookies
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/domain.Response'
      summary: User Login
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: Clear access_token and refresh_token HttpOnly cookies
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Logout User
      tags:
      - auth
  /v1/auth/me:
    get:
      consumes:
      - application/json
      description: Returns 200 OK and verification status if the user has a valid
        access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AuthStatusResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Check authentication status
      tags:
      - auth
  /v1/auth/otp/send:
    post:
      consumes:
      - application/json
      description: Generates and sends an OTP to the authenticated user's email
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Send OTP
      tags:
      - auth
  /v1/auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verify the authenticated user's email using an OTP
      parameters:
      - description: Verify Email Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Verify Email with OTP
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchange the refresh_token cookie (or request body) for a new access token.
        The server sets new access_token and refresh_token cookies automatically.
      parameters:
      - description: Refresh Request (optional if refresh_token cookie is set)
        in: body
        name: request
        schema:
          $ref: '#/definitions/domain.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Refresh Access Token
      tags:
      - auth
  /v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password using an OTP and email
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
