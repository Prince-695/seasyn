name: Full Build (Main)

on:
  push:
    branches:
      - main

jobs:

  # ======================
  # 🔵 BACKEND JOB
  # ======================
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod tidy
        working-directory: backend

      - name: Format check
        run: |
          if [ -n "$(gofmt -l backend)" ]; then
            echo "Go files are not formatted:"
            gofmt -l backend
            exit 1
          fi

      - name: Vet
        run: go vet ./...
        working-directory: backend

      - name: Install lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Lint
        run: golangci-lint run ./...
        working-directory: backend

      - name: Build
        run: go build ./...
        working-directory: backend


  # ======================
  # 🟡 FRONTEND JOB
  # ======================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

      - name: Type check
        run: pnpm typecheck
        working-directory: frontend

      - name: Format check
        run: pnpm format:check
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend